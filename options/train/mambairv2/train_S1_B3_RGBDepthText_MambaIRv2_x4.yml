# Stage-1 B3 change: RGB + depth + frozen CLIP text, minimal fusion/FiLM, x4.
name: S1_B3_RGBDepthText_MambaIRv2_x4
model_type: RGBDepthTextMambaIRv2Model
scale: 4
num_gpu: 1
manual_seed: 10

datasets:
  train:
    task: SR
    name: DIV2K-Train-RGBDepthText
    type: RGBDepthTextPairedImageDataset
    dataroot_gt:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_train_HR/DIV2K_train_HR
    dataroot_lq:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_train_LR_bicubic_X4/DIV2K_train_LR_bicubic/X4
    dataroot_depth:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K-Depth/DIV2K_train_LR_depth_X4
    dataroot_text:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K-Text/DIV2K-train-Text
    filename_tmpl: '{}x4'
    filename_tmpl_depth: '{}x4'
    filename_tmpl_text: '{}'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-6
    text_file_ext: .txt
    text_encoding: utf-8
    io_backend:
      type: disk
    gt_size: 192
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    task: SR
    name: DIV2K-Valid-RGBDepthText
    type: RGBDepthTextPairedImageDataset
    dataroot_gt:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_valid_HR/DIV2K_valid_HR
    dataroot_lq:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_valid_LR_bicubic_X4/DIV2K_valid_LR_bicubic/X4
    dataroot_depth:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K-Depth/DIV2K_valid_LR_depth_X4
    dataroot_text:
      - /home/BRAIN/xukai/datasets/M3SR/DIV2K-Text/DIV2K-valid-Text
    filename_tmpl: '{}x4'
    filename_tmpl_depth: '{}x4'
    filename_tmpl_text: '{}'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-6
    text_file_ext: .txt
    text_encoding: utf-8
    io_backend:
      type: disk

network_g:
  type: RGBDepthTextMambaIRv2
  upscale: 4
  in_chans: 3
  depth_in_chans: 1
  img_size: 64
  img_range: 1.0
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv
  # B3 text branch: same local HF CLIP ViT-L/14 used by B2.
  clip_model_path: /home/BRAIN/xukai/files/clip-vit-large-patch14
  clip_freeze: true
  clip_local_files_only: true
  max_text_length: 77

path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: 2.0e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5
  total_iter: 500000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 5000.0
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

logger:
  print_freq: 500
  save_checkpoint_freq: 5000.0
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 33504
